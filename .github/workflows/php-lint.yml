name: PHP Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3"]

    name: PHP ${{ matrix.php }} syntax check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          fails=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=${file}::Syntax error"
              php -l "$file" || true
              fails=$((fails + 1))
            fi
          done < <(find . -name "*.php" -not -path "./node_modules/*" -print0)
          if [ "$fails" -gt 0 ]; then
            echo "$fails file(s) failed lint."
            exit 1
          fi
          echo "All PHP files passed syntax check on PHP ${{ matrix.php }}."
